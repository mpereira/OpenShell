[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openshell-chaos"
version = "0.1.0"
description = "Declarative chaos experiments for OpenShell e2e environments"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
chaos = "chaos.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is the formatter's job, as at the repo root
