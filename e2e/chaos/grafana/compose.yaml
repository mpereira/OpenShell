# Local viewer for chaos runs. Start it with `mise run e2e:chaos:grafana RUN_DIR...`;
# see "Viewing runs in Grafana" in ../README.md.
name: chaos-grafana

services:
  # Replaces the stored data with blocks built from the exported runs.
  import:
    image: prom/prometheus:v3.1.0
    profiles: [import]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -rf /prometheus/* &&
        for f in /import/*.om; do
        promtool tsdb create-blocks-from openmetrics "$$f" /prometheus || exit 1;
        done
    volumes:
      - ${CHAOS_GRAFANA_IMPORT:?set by grafana/view.sh}:/import:ro
      - tsdb:/prometheus

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Runs are in the past; keep them however old they are.
      - --storage.tsdb.retention.time=100y
      # A short lookback so a gap in the data shows as a gap. Exported series
      # repeat at least every 5s; scrape intervals over 15s show as gaps.
      - --query.lookback-delta=15s
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tsdb:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chaos-run.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      # Per-experiment dashboards generated by view.sh.
      - ${CHAOS_GRAFANA_IMPORT:?set by grafana/view.sh}:/var/lib/grafana/import:ro
    ports:
      - 127.0.0.1:${CHAOS_GRAFANA_PORT:-3030}:3000
    depends_on: [prometheus]

volumes:
  tsdb:
