apiVersion: chaos/v1alpha1
id: valid-freeze
version: 1
title: t
hypothesis: h
description: d
default-adapter: openshell-docker
operations:
  - {name: f, description: d, uses: freeze, target: {workload: w, role: supervisor}, select: all, duration: 5s}
workloads:
  - name: w
    description: d
    kind: shell
    instances: 1
    timeout: 1m
    run: "true"
    checks: [{name: ok, description: d, kind: exit-code, equals: 0}]
flow: {parallel: [w, {serial: [{wait: {workload: w, condition: started}}, f]}]}
